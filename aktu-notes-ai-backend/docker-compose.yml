version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aktu_notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-aktu_notes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-aktu_notes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aktu_notes_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AKTU Notes AI"
      APP_ENV: "production"
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-aktu_notes}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_secure_random_secret_at_least_32_chars}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      CHROMA_PERSIST_DIR: "/app/storage/chroma"
      UPLOAD_DIR: "/app/storage/uploads"
      MAX_UPLOAD_SIZE_MB: 20
      MAX_PDF_PAGES: 300
      CHUNK_SIZE_TOKENS: 700
      CHUNK_OVERLAP_TOKENS: 100
      RAG_TOP_K: 3
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - uploads_data:/app/storage/uploads
      - chroma_data:/app/storage/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  chroma_data:
    driver: local

