services:
  - type: web
    name: aktu-notes-ai-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CORS_ORIGINS
        value: https://your-frontend-app.vercel.app,http://localhost:5173,http://localhost:3000
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
      - key: CHROMA_PERSIST_DIR
        value: ./storage/chroma
      - key: UPLOAD_DIR
        value: ./storage/uploads

